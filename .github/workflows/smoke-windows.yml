# TEMPORARY: inspect DeTube's page scripts on real Windows (WebView2) over DevTools.
name: Windows page-script inspection

on:
  push:
    branches: [fix/windows-page-scripts]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build (debug)
        working-directory: src-tauri
        run: cargo build
      - name: Run and inspect
        shell: pwsh
        run: |
          $env:DETUBE_DEVTOOLS = "1"
          $p = Start-Process -FilePath src-tauri/target/debug/detube.exe -PassThru `
                -RedirectStandardError detube-stderr.log -RedirectStandardOutput detube-stdout.log
          Start-Sleep -Seconds 15
          node .github/smoke/inspect.mjs
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          "---- stderr"; Get-Content detube-stderr.log -ErrorAction SilentlyContinue | Select-Object -First 60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inspect
          path: |
            cdp-*.png
            detube-*.log

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xvfb imagemagick \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build (debug)
        working-directory: src-tauri
        run: cargo build
      - name: Run and probe
        run: |
          export DETUBE_PROBE=1 RUST_BACKTRACE=1
          xvfb-run -a -s "-screen 0 1280x900x24" bash -c '
            ./src-tauri/target/debug/detube 2> detube-linux.log &
            pid=$!
            for i in $(seq 1 150); do grep -q "\\[probe\\] done" detube-linux.log && break; sleep 1; done
            import -window root linux-screen.png || true
            kill $pid || true'
          echo "---- probe"; grep "\\[probe\\]" detube-linux.log || true
          echo "---- other stderr"; grep -v "\\[probe\\]" detube-linux.log | head -40 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inspect-linux
          path: |
            linux-screen.png
            detube-linux.log
