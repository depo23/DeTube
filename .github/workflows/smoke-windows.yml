# TEMPORARY: diagnose the Windows startup hang. Builds a debug DeTube, runs it,
# records whether the window responds, a screenshot and the app's log.
name: Windows startup smoke test

on:
  push:
    branches: [fix/windows-startup]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build (debug, console)
        working-directory: src-tauri
        run: cargo build
      - name: Run and observe
        shell: pwsh
        run: |
          $env:RUST_BACKTRACE = "1"
          $p = Start-Process -FilePath src-tauri/target/debug/detube.exe -PassThru `
                -RedirectStandardError detube-stderr.log -RedirectStandardOutput detube-stdout.log
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          foreach ($t in 5, 15, 30) {
            Start-Sleep -Seconds ($t - $(if ($t -eq 5) {0} elseif ($t -eq 15) {5} else {15}))
            $proc = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
            if (-not $proc) { "t=${t}s: process exited (code $($p.ExitCode))"; break }
            "t=${t}s: responding=$($proc.Responding) title='$($proc.MainWindowTitle)' cpu=$($proc.CPU)"
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("screen-${t}s.png")
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 1
          "---- stderr"; Get-Content detube-stderr.log -ErrorAction SilentlyContinue | Select-Object -First 200
          "---- stdout"; Get-Content detube-stdout.log -ErrorAction SilentlyContinue | Select-Object -First 50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: |
            screen-*.png
            detube-*.log
