name: Build Windows & Linux

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Doc-only changes don't build or publish a release.
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, so two quick pushes can't pick the same version number.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags, to find the last version

      # Next version = last vX.Y tag + 0.1 in the minor (1.0, 1.1 … 1.10). Pushing a tag like v2.0 sets a new base.
      - name: Compute version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            last=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -t. -k1,1n -k2,2n | tail -1 || true)
            if [ -z "$last" ]; then v="1.0"; else v="${last%%.*}.$(( ${last#*.} + 1 ))"; fi
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version $v"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04  # older glibc, so the AppImage runs on more distributions
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version
        run: |
          jq --arg v "${{ needs.version.outputs.version }}.0" '.version = $v' src-tauri/tauri.conf.json > conf.tmp
          mv conf.tmp src-tauri/tauri.conf.json

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build
        run: npx --yes @tauri-apps/cli@^2 build --bundles ${{ matrix.bundles }}

      # Stable file names, so the README's "latest" links never change.
      - name: Collect
        run: |
          mkdir dist
          b=src-tauri/target/release/bundle
          if [ "$RUNNER_OS" = Windows ]; then
            cp $b/nsis/*-setup.exe dist/DeTube-Setup.exe
          else
            cp $b/appimage/*.AppImage dist/DeTube-x86_64.AppImage
            cp $b/deb/*.deb dist/DeTube-amd64.deb
            cp $b/rpm/*.rpm dist/DeTube-x86_64.rpm
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: DeTube-${{ runner.os }}
          path: dist/*

  # Every push to main becomes the "latest" release with all installers attached.
  release:
    needs: [version, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: DeTube v${{ needs.version.outputs.version }}
          body: Version ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*
