name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, so two quick pushes can't pick the same version number.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags, to find the last version

      # Next version = last vX.Y tag + 0.1 in the minor (1.0, 1.1 … 1.10). Pushing a tag like v2.0 sets a new base.
      - name: Compute version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            last=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -t. -k1,1n -k2,2n | tail -1)
            if [ -z "$last" ]; then v="1.0"; else v="${last%%.*}.$(( ${last#*.} + 1 ))"; fi
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version $v"

      - name: Stamp version
        run: |
          jq --arg v "${{ steps.version.outputs.version }}.0" '.version = $v' src-tauri/tauri.conf.json > conf.tmp
          mv conf.tmp src-tauri/tauri.conf.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build installer
        run: npx --yes @tauri-apps/cli@^2 build

      - name: Collect installer
        run: cp src-tauri/target/release/bundle/nsis/*-setup.exe WinTube-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: WinTube-Setup
          path: WinTube-Setup.exe

      # Every push to main becomes the "latest" release, so the README link always gets the newest build.
      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: WinTube v${{ steps.version.outputs.version }}
          body: Version ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: WinTube-Setup.exe
