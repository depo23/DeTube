<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DeTube</title>
<style>
  :root {
    --bg: #1b1b1f;
    --tab: #26262b;
    --tab-hover: #303036;
    --tab-active: #0f0f0f;
    --text: #e8e8ea;
    --muted: #9a9aa2;
    --accent: #ff6b4a;
    --banner: #2b2235;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; user-select: none; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  #bar { height: 40px; display: flex; align-items: flex-end; gap: 4px; padding: 0 6px; }
  .icon { width: 32px; height: 32px; margin-bottom: 4px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); flex: none; }
  .icon:hover { background: var(--tab-hover); color: var(--text); }

  #tabs { flex: 1; display: flex; gap: 2px; min-width: 0; height: 34px; align-items: flex-end; overflow: hidden; }
  .tab { flex: 0 1 220px; min-width: 64px; height: 34px; display: flex; align-items: center; gap: 6px;
    padding: 0 6px 0 12px; border-radius: 8px 8px 0 0; background: var(--tab); color: var(--muted); }
  .tab:hover { background: var(--tab-hover); }
  .tab.active { background: var(--tab-active); color: var(--text); }
  .tab span { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tab .close { width: 22px; height: 22px; border-radius: 5px; display: grid; place-items: center; opacity: .7; }
  .tab .close:hover { background: #ffffff1f; opacity: 1; }
  .tab .close svg { width: 12px; height: 12px; }

  #banner { height: 36px; display: none; align-items: center; gap: 10px; padding: 0 12px; background: var(--banner); }
  #banner.show { display: flex; }
  #banner .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  #banner .grow { flex: 1; }
  #banner button { padding: 4px 12px; border-radius: 6px; }
  #download { background: var(--accent); color: #111; font-weight: 600; }
  #later:hover { background: #ffffff1a; }
</style>
</head>
<body>
  <div id="bar">
    <button class="icon" id="back" title="Back (Alt+←)"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button>
    <button class="icon" id="forward" title="Forward (Alt+→)"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg></button>
    <button class="icon" id="reload" title="Reload (F5)"><svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v3h-3"/></svg></button>
    <div id="tabs"></div>
    <button class="icon" id="add" title="New tab (Ctrl+T)"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg></button>
    <button class="icon" id="menu" title="Settings"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg></button>
  </div>
  <div id="banner">
    <span class="dot"></span>
    <span id="banner-text"></span>
    <span class="grow"></span>
    <button id="download">Download</button>
    <button id="later">Later</button>
  </div>

<script>
  const { invoke } = window.__TAURI__.core;
  const { listen } = window.__TAURI__.event;
  const { getVersion } = window.__TAURI__.app;
  const REPO = 'depo23/DeTube';
  const BAR = 40, BANNER = 36;
  const $ = id => document.getElementById(id);

  // ---- tabs
  function render({ tabs, active }) {
    const box = $('tabs');
    box.replaceChildren(...tabs.map(t => {
      const el = document.createElement('div');
      el.className = 'tab' + (t.label === active ? ' active' : '');
      el.title = t.title;
      const name = document.createElement('span');
      name.textContent = t.title;
      const close = document.createElement('button');
      close.className = 'close';
      close.title = 'Close tab (Ctrl+W)';
      close.innerHTML = '<svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3 3 9"/></svg>';
      close.onclick = e => { e.stopPropagation(); invoke('close_tab_cmd', { label: t.label }); };
      el.onmousedown = e => {
        if (e.button === 1) invoke('close_tab_cmd', { label: t.label });          // middle-click closes
        else if (e.button === 0) invoke('select_tab_cmd', { label: t.label });
      };
      el.append(name, close);
      return el;
    }));
  }
  listen('tabs', e => render(e.payload));
  invoke('get_tabs').then(render);

  $('back').onclick = () => invoke('nav', { action: 'back' });
  $('forward').onclick = () => invoke('nav', { action: 'forward' });
  $('reload').onclick = () => invoke('nav', { action: 'reload' });
  $('add').onclick = () => invoke('new_tab');
  $('menu').onclick = () => invoke('show_menu');

  // Same shortcuts as inside YouTube, for when the tab bar has focus.
  document.addEventListener('keydown', e => {
    if (!e.ctrlKey) return;
    const key = e.key.toLowerCase();
    if (key === 't') invoke('new_tab');
    else if (key === 'w') invoke('close_active');
    else if (key === 'tab') invoke('cycle_tab_cmd', { step: e.shiftKey ? -1 : 1 });
    else return;
    e.preventDefault();
  });

  // ---- updates
  let downloadUrl = null;
  function isNewer(latest, current) {
    const a = latest.split('.').map(Number), b = current.split('.').map(Number);
    for (let i = 0; i < Math.max(a.length, b.length); i++) {
      const x = a[i] || 0, y = b[i] || 0;
      if (x !== y) return x > y;
    }
    return false;
  }
  async function checkUpdates(manual) {
    const current = await getVersion();
    if (!manual && current === '0.0.0') return;   // local development build
    try {
      const res = await fetch(`https://api.github.com/repos/${REPO}/releases/latest`);
      if (!res.ok) throw new Error(res.status);
      const release = await res.json();
      const latest = (release.tag_name || '').replace(/^v/, '');
      if (/^\d+(\.\d+)+$/.test(latest) && isNewer(latest, current)) {
        // Windows gets the installer directly; on Linux the release page lets people pick AppImage, .deb or .rpm.
        const exe = navigator.userAgent.includes('Windows') && (release.assets || []).find(a => a.name.endsWith('.exe'));
        downloadUrl = exe ? exe.browser_download_url : release.html_url;
        $('banner-text').textContent = `DeTube ${latest} is available.`;
        $('banner').classList.add('show');
        invoke('set_bar_height', { height: BAR + BANNER });
      } else if (manual) {
        alert(`DeTube ${current} is up to date.`);
      }
    } catch (e) {
      if (manual) alert("Couldn't check for updates. Check your connection and try again.");
    }
  }
  $('download').onclick = () => downloadUrl && invoke('open_external', { url: downloadUrl });
  $('later').onclick = () => {
    $('banner').classList.remove('show');
    invoke('set_bar_height', { height: BAR });
  };
  listen('check-updates', () => checkUpdates(true));
  checkUpdates(false);
  setInterval(() => checkUpdates(false), 6 * 60 * 60 * 1000);
</script>
</body>
</html>
