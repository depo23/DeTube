[package]
name = "wintube"
version = "0.0.0"
description = "YouTube in its own window, with tabs and Shorts / AI-video filters"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" enables multiple web views in one window (the tab bar + one view per tab).
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
